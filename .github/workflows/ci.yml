name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest pyflakes
      - name: Lint
        working-directory: python
        run: python -m pyflakes openpaykernel tests examples
      - name: Tests
        working-directory: python
        run: python -m pytest -q
      - name: Conformance vectors are up to date
        working-directory: python
        run: |
          PYTHONPATH=. python tests/gen_vectors.py
          git diff --exit-code -- ../conformance/vectors

  c:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        cc: [gcc, clang]
        exclude:
          - os: macos-latest
            cc: gcc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install PC/SC (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
      - name: Build (library, tests, examples incl. PC/SC)
        working-directory: c
        env:
          CC: ${{ matrix.cc }}
        run: |
          cmake -S . -B build -DCMAKE_C_FLAGS="-Werror" -DOPK_BUILD_PCSC_EXAMPLE=ON
          cmake --build build
      - name: Run reader template example
        working-directory: c
        run: ./build/opk_reader_template
      - name: Test
        working-directory: c
        run: ctest --test-dir build --output-on-failure

  c-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with ASan + UBSan
        working-directory: c
        env:
          CC: clang
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build
      - name: Conformance vectors
        working-directory: c
        run: ./build/test_vectors ../conformance/vectors/*.txt
      - name: Fuzz corrupted card responses
        working-directory: c
        env:
          UBSAN_OPTIONS: halt_on_error=1
          OPK_FUZZ: "1000"
        run: ./build/test_vectors ../conformance/vectors/*.txt

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv8m.main-none-eabihf, thumbv6m-none-eabi, riscv32imac-unknown-none-elf
      - name: Format
        working-directory: rust
        run: cargo fmt --check
      - name: Clippy
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests (unit, 19 conformance vectors, doc)
        working-directory: rust
        run: cargo test
      - name: Fuzz corrupted card responses (no panics)
        working-directory: rust
        env:
          OPK_FUZZ: "2000"
        run: cargo test --release --test conformance fuzz
      - name: no_std builds for bare-metal targets
        working-directory: rust
        run: |
          for t in thumbv8m.main-none-eabihf thumbv6m-none-eabi riscv32imac-unknown-none-elf; do
            cargo build --lib --release --no-default-features --target $t
          done
      - name: Run reader template example
        working-directory: rust
        run: cargo run --example reader_template
